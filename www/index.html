<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf3e7">
<title>奶龙合成所</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">

  <h1 class="title">奶龙合成所</h1>

  <section class="hud">
    <div class="score-chip">
      <span class="label">分数</span>
      <strong id="score">0</strong>
    </div>
    <div class="score-chip">
      <span class="label">最高分</span>
      <strong id="best" class="hot">0</strong>
    </div>
    <div class="hud-tools">
      <button id="btn-sound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
      <button id="btn-restart" class="cta">↻ 重开</button>
    </div>
  </section>

  <section class="board" id="board">
    <canvas id="game" width="420" height="620"></canvas>
    <div class="next-box">
      <span>下一个</span>
      <img id="next-img" alt="下一个">
    </div>
    <div class="over" id="over" hidden>
      <p class="over-title" id="over-title">堆到线上了</p>
      <p class="over-score">本局 <b id="over-score">0</b></p>
      <p class="over-best" id="over-note"></p>
      <button class="cta big" id="btn-again">再来一局</button>
    </div>
  </section>

  <section class="chain" id="chain" aria-label="合成链"></section>
  <p class="hint">按住画面左右拖动瞄准 · 松手投放 · 相同奶龙相撞进化一级</p>

</div>
<script src="vendor/matter.min.js"></script>
<script src="vendor/decomp.min.js"></script>
<script src="outlines.js"></script>
<script src="game.js"></script>
</body>
</html>
